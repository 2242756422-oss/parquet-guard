name: Release & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_target:
        description: "Target repository to publish: 'testpypi' or 'pypi'"
        required: true
        default: "testpypi"
        type: choice
        options:
          - testpypi
          - pypi

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-verify:
    name: Build & Verify Release Artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build and packaging validation tools
        run: |
          python -m pip install --upgrade pip build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Validate distribution metadata with Twine
        run: twine check --strict dist/*

      - name: Verify package version matches pyproject.toml
        run: |
          PKG_VERSION=$(python -c "import re; m = re.search(r'version\s*=\s*\"([^\"]+)\"', open('pyproject.toml').read()); print(m.group(1))")
          echo "Expected version: ${PKG_VERSION}"
          test -f "dist/parquet_guard-${PKG_VERSION}-py3-none-any.whl"
          test -f "dist/parquet_guard-${PKG_VERSION}.tar.gz"

      - name: Test installation in clean isolated virtual environment
        run: |
          PKG_VERSION=$(python -c "import re; m = re.search(r'version\s*=\s*\"([^\"]+)\"', open('pyproject.toml').read()); print(m.group(1))")
          python -m venv /tmp/clean_venv
          /tmp/clean_venv/bin/pip install --upgrade pip
          /tmp/clean_venv/bin/pip install "dist/parquet_guard-${PKG_VERSION}-py3-none-any.whl"
          
          # CLI Smoke tests
          INSTALLED_VER=$(/tmp/clean_venv/bin/parquet-guard --version)
          echo "Installed CLI version: ${INSTALLED_VER}"
          echo "${INSTALLED_VER}" | grep -F "${PKG_VERSION}"
          
          /tmp/clean_venv/bin/parquet-guard --help
          /tmp/clean_venv/bin/parquet-guard eval-ai --provider mock

      - name: Upload release distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-artifacts
          path: dist/
          retention-days: 7

  publish-testpypi:
    name: Publish to TestPyPI (OIDC Trusted Publishing)
    needs: build-and-verify
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish_target == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/parquet-guard
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-artifacts
          path: dist/

      - name: Publish package distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/

  publish-pypi:
    name: Publish to PyPI (OIDC Trusted Publishing)
    needs: build-and-verify
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_target == 'pypi')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/parquet-guard
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-artifacts
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  create-github-release:
    name: Create GitHub Release
    needs: [build-and-verify]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-artifacts
          path: dist/

      - name: Determine if prerelease
        id: prerelease-check
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if echo "$TAG_NAME" | grep -Eq '[a-zA-Z]'; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release with Artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ steps.prerelease-check.outputs.is_prerelease == 'true' }}
