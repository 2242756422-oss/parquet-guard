name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy

      - name: Run Ruff linter
        run: ruff check .

      - name: Run Ruff format check
        run: ruff format --check .

      - name: Run Mypy
        run: |
          pip install -e ".[dev]"
          mypy --explicit-package-bases src tests examples benchmarks

  test-matrix:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    needs: lint-and-typecheck
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Pytest
        run: pytest tests/ -v

  build-distribution:
    name: Build Wheel & Sdist
    needs: test-matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tool
        run: python -m pip install --upgrade pip build

      - name: Build distributions
        run: python -m build

      - name: Verify build artifacts
        run: |
          ls -l dist/
          PKG_VERSION=$(python -c "import re; m = re.search(r'version\s*=\s*\"([^\"]+)\"', open('pyproject.toml').read()); print(m.group(1))")
          echo "Verifying build artifacts for version: ${PKG_VERSION}"
          test -f "dist/parquet_guard-${PKG_VERSION}-py3-none-any.whl"
          test -f "dist/parquet_guard-${PKG_VERSION}.tar.gz"

      - name: Install wheel in clean virtualenv & verify CLI
        run: |
          PKG_VERSION=$(python -c "import re; m = re.search(r'version\s*=\s*\"([^\"]+)\"', open('pyproject.toml').read()); print(m.group(1))")
          python -m venv /tmp/clean_venv
          /tmp/clean_venv/bin/pip install "dist/parquet_guard-${PKG_VERSION}-py3-none-any.whl"
          /tmp/clean_venv/bin/parquet-guard --version
          /tmp/clean_venv/bin/parquet-guard --help
